name = "leonida-atlas"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-19"

[[d1_databases]]
binding = "DB"
database_name = "leonida-community"
database_id = "35be4c41-2994-4f4c-a270-95bf47d6816b"

[ai]
binding = "AI"

# Secrets / variables (set in the Cloudflare dashboard, never here):
