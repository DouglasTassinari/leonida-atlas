name: Scheduled posts rebuild
on:
  schedule:
    # every hour at :02 (UTC). Posts use publishAt with a -03:00 offset, so any hour works.
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if no post is due'
        required: false
        default: 'false'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/data/posts
      # GitHub often runs the schedule hours late, so look at the live site instead of a time window:
      # rebuild when a post from the last 3 days is due and its page still answers 404.
      - name: Is any due post missing from the site?
        id: due
        run: |
          now=$(date -u +%s); due=0
          for f in src/data/posts/*.js; do
            slug=$(sed -nE "s/^ *slug: *'([^']+)'.*/\1/p" "$f" | head -1)
            t=$(sed -nE "s/^ *publishAt: *'([^']+)'.*/\1/p" "$f" | head -1)
            [ -n "$slug" ] && [ -n "$t" ] || continue
            s=$(date -d "$t" +%s 2>/dev/null || echo 0)
            if [ "$s" -le "$now" ] && [ "$s" -gt $((now-259200)) ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://leonida-atlas-4z0.pages.dev/en/posts/$slug/")
              if [ "$code" = "404" ]; then echo "missing: $slug"; due=1; fi
            fi
          done
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - name: Trigger Cloudflare Pages deploy hook
        if: steps.due.outputs.due == '1' || github.event.inputs.force == 'true'
        run: curl -fsS -X POST -d "" "${{ secrets.CF_DEPLOY_HOOK }}"
